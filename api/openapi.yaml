openapi: 3.1.0
info:
  title: Artsmart Strategy API
  version: 0.4.0
  description: Team-scoped content operations API. PostgreSQL credentials remain server-side.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /api/health/live:
    get:
      security: []
      summary: Process liveness
      responses:
        '200': { description: Service process is alive }
  /api/health/ready:
    get:
      security: []
      summary: Database readiness
      responses:
        '200': { description: Database and schema are ready }
        '503': { description: Database unavailable }
  /api/runtime-mode:
    get:
      security: []
      summary: Persistence mode
      responses:
        '200': { description: Always reports persistent PostgreSQL mode }
  /api/auth/status:
    get:
      security: []
      summary: Check whether initial account setup is needed
      responses:
        '200': { description: Setup status }
  /api/auth/setup:
    post:
      security: []
      summary: Create the initial team owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountSetup' }
      responses:
        '201': { description: Access token and account }
        '409': { description: Owner already exists }
  /api/auth/register-team:
    post:
      security: []
      summary: Create a team and owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountSetup' }
      responses:
        '201': { description: Access token and account }
  /api/auth/login:
    post:
      security: []
      summary: Create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
      responses:
        '200': { description: Access token and account }
        '401': { description: Credentials invalid }
  /api/auth/me:
    get:
      summary: Current account
      responses:
        '200': { description: Account profile }
  /api/contents:
    get:
      summary: List current-team contents
      responses:
        '200': { description: Team content list }
    post:
      summary: Create content
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentInput' }
      responses:
        '201': { description: Created content }
        '422': { description: Validation error }
  /api/contents/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get one team content
      responses:
        '200': { description: Content record }
        '404': { description: Not found in current team }
    patch:
      summary: Update content fields
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Updated content }
    delete:
      summary: Delete a content record
      responses:
        '204': { description: Deleted }
  /api/contents/{id}/advance:
    post:
      summary: Advance content from pending production to produced
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Workflow advanced }
        '409': { description: Current state cannot advance }
  /api/contents/advance-bulk:
    post:
      summary: Advance selected 待制作 records to 已制作 using the single-record rule
      description: Records that are missing, already moved, or never eligible are reported per record; successful records are committed together.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, maxItems: 200, items: { type: string, format: uuid } }
      responses:
        '200':
          description: Per-record results with advanced/failed counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowAdvance'}
  /api/teams:
    get:
      summary: Get caller's team
      responses:
        '200': { description: One team record }
  /api/users:
    get:
      summary: List current-team users
      responses:
        '200': { description: Team members }
    post:
      summary: Add a team member; owner only
      responses:
        '201': { description: Member created }
        '403': { description: Owner role required }
  /api/performances:
    get:
      summary: List current-team 正式演出 with persisted promotional-video counters
      description: >-
        Each row reports content_count, published_content_count,
        unpublished_content_count, schedulable_content_count and
        scheduled_content_count. Shows whose start time has passed are settled to
        已演出 before the list is returned; 已取消 is never rewritten.
      responses:
        '200': { description: Bookings }
    post:
      summary: Create a 正式演出
      description: >-
        starts_at accepts RFC3339 or the browser's datetime-local form. Status is
        one of 筹备中, 预热中, 已演出, 已取消.
      responses:
        '201': { description: Show created with its counters }
        '422': { description: Invalid title, time, status or owner }
  /api/performances/{id}:
    get:
      summary: One 正式演出 with its aggregated promotional content
      description: >-
        Returns the show, days_to_start, its published assets with real effect
        data, its unpublished asset list, and the full pre-heat timeline built
        from schedule rows.
      responses:
        '200': { description: Show detail }
        '404': { description: Show does not exist in the caller's team }
    patch:
      summary: Update one 正式演出; editor role required
      description: Partial update; only the submitted keys are written.
      responses:
        '200': { description: Updated show }
        '404': { description: Show does not exist in the caller's team }
        '422': { description: Invalid field value }
    delete:
      summary: Delete one 正式演出; editor role required
      description: >-
        Linked promotional videos are kept and only lose the association, so
        deleting a show never deletes content.
      responses:
        '204': { description: Show deleted }
        '404': { description: Show does not exist in the caller's team }
  /api/performances/{id}/plan:
    post:
      summary: Generate the whole-show pre-heat schedule; editor role required
      description: >-
        Plans only the show's unpublished 待排期 videos, never past the show's
        start time, spread across days and platforms. The result is stored as a
        normal recommendation and adopted through POST /api/schedule/adopt.
        Reasons state the historical evidence used; insufficient samples are
        reported honestly instead of inventing a reason.
      responses:
        '200': { description: Plan with per-item reasons and sample counts }
        '404': { description: Show does not exist in the caller's team }
        '422': { description: The show has already started }
  /api/tags:
    get:
      summary: List current-team tags
      responses:
        '200': { description: Tag library }
    post:
      summary: Create or find a normalized tag
      responses:
        '201': { description: Tag record }
  /api/stats/overview:
    get:
      summary: Published-only overview metrics
      responses:
        '200':
          description: Team statistics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }
  /api/rules/system:
    get:
      summary: Read-only, versioned system rule set (never editable through the API)
      responses:
        '200': { description: System rule sets with their effective flag }
  /api/schedule/policy:
    get:
      summary: Effective scheduling policy and its inclusive planning window
      responses:
        '200': { description: 'planning_horizon_days counts natural days starting today, so the window is today .. today + N - 1' }
  /api/schedule:
    get:
      summary: Calendar rows in an inclusive date range
      parameters:
        - { name: start, in: query, required: true, schema: { type: string, format: date } }
        - { name: end, in: query, required: true, schema: { type: string, format: date } }
        - name: performance_id
          in: query
          required: false
          schema: { type: string }
          description: Restrict the calendar to one 正式演出 through content.performance_id
      responses:
        '200': { description: 'Plans with pure YYYY-MM-DD planned_date values' }
  /api/schedule/{id}/adjustments:
    get:
      summary: Recorded manual changes of one plan
      description: Manual edits are marked source=manual and logged with their before/after values.
      responses:
        '200': { description: Adjustment entries with actor, detail and created_at }
  /api/stats/performances:
    get:
      summary: Published effect data aggregated per 正式演出
      description: >-
        Shows without published videos are reported with zero samples instead of
        being dropped; a per-show sample_sufficient flag and the team baseline
        travel with the response.
      responses:
        '200': { description: 'Per-show comparison plus min_sample and baseline' }
  /api/stats/platform:
    get:
      summary: Published-only metrics by platform
      responses:
        '200': { description: Platform statistics }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    WorkflowAdvance:
      type: object
      required: [advanced, failed, results]
      properties:
        advanced: { type: integer }
        failed: { type: integer }
        results:
          type: array
          items:
            type: object
            required: [id, status]
            properties:
              id: { type: string }
              title: { type: string }
              status: { type: string, enum: [advanced, failed] }
              reason: { type: string, description: Why the record could not advance }
    Overview:
      type: object
      required: [published_count, total_posts, total_views, total_interactions, platform_count, avg_completion, sample_count, top_contents]
      properties:
        published_count: { type: integer }
        unpublished_count: { type: integer }
        total_posts: { type: integer }
        total_views: { type: integer }
        total_likes: { type: integer }
        total_interactions: { type: integer }
        platform_count: { type: integer }
        avg_completion: { type: number, description: 'Percentage value on a 0-100 scale' }
        sample_count: { type: integer }
        weights:
          type: object
          properties:
            completion: { type: number }
            interaction: { type: number }
        top_contents:
          type: array
          description: Published assets ordered by score, then publication time, then id
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              category: { type: string }
              platform: { type: string }
              completion: { type: number, description: 'Percentage value on a 0-100 scale' }
              interaction_rate: { type: number, description: 'Percentage value on a 0-100 scale' }
              score: { type: number, description: 'completion * completion weight + interaction rate * interaction weight' }
              published_at: { type: string, format: date-time }
    AccountSetup:
      type: object
      required: [team_name, name, email, password]
      properties:
        team_name: { type: string, maxLength: 100 }
        name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 10 }
    ContentInput:
      type: object
      required: [title, platform, published_at, lifecycle, workflow_state]
      properties:
        title: { type: string, maxLength: 300 }
        category: { type: string }
        platform: { type: string }
        published_at: { type: string, format: date-time }
        lifecycle: { type: string, enum: [已发布, 未发布] }
        workflow_state: { type: string, enum: [待制作, 已制作, 待排期, 已排期, 已发布, 未发布] }
        tags: { type: array, items: { type: string } }
