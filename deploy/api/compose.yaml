services:
  api:
    image: artsmart-api:0.4.0
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      API_ADDR: ${API_ADDR:-:8080}
      # Optional: override the container healthcheck URL when the health endpoint
      # is not on the loopback host/port derived from API_ADDR.
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
      TZ: ${TZ:-Asia/Shanghai}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS to the frontend origin}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-15s}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.kunyou.asia/v1}
      AI_MODEL: ${AI_MODEL:-qwen3.8-max}
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "${API_BIND_ADDRESS:?Set API_BIND_ADDRESS to the API private IP}:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
