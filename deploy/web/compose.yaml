services:
  web:
    image: artsmart-web:latest
    # Build from this repository so the image carries the current nginx template.
    # Reusing a pre-built image (for example a `latest` tag left over from an
    # earlier release) is what makes Nginx fall back to a baked-in upstream and
    # fail with `host not found in upstream "api"`.
    build:
      context: ../../web
      dockerfile: Dockerfile
      args:
        # Empty keeps the browser on the page's own origin: Nginx proxies /api/.
        VITE_API_BASE_URL: ""
    environment:
      API_UPSTREAM: ${API_UPSTREAM:?Set API_UPSTREAM to the API private URL}
      NGINX_ENVSUBST_FILTER: ^API_UPSTREAM$
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
