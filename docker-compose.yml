name: artsmart

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arts_smart}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-arts_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}}
      APP_DB_USER: ${APP_DB_USER:-arts_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      LOAD_EXAMPLE_DATA: ${LOAD_EXAMPLE_DATA:-true}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/sql:/docker-entrypoint-sql:ro
    networks:
      - db-net
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    stop_grace_period: 1m
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_ADDR: ":8080"
      DATABASE_URL: postgresql://${APP_DB_USER:-arts_app}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-arts_smart}?sslmode=disable
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:5173}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.kunyou.asia/v1}
      AI_MODEL: ${AI_MODEL:-qwen3.8-max}
      AI_API_KEY: ${AI_API_KEY:-}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-15s}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net
      - db-net
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-net
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

networks:
  app-net:
    driver: bridge
  db-net:
    driver: bridge
    internal: true

volumes:
  pgdata:
    name: arts-smart-postgres-data
