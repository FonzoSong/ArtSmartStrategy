services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the managed PostgreSQL service}
      APP_SECRET: ${APP_SECRET:?Set a random APP_SECRET of at least 32 characters}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.kunyou.asia/v1}
      AI_MODEL: ${AI_MODEL:-qwen3.8-max}
      AI_API_KEY: ${AI_API_KEY:-}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
