<?xml version="1.0" encoding="UTF-8"?>
<!--
  艺数智策 · 首页青绿山水插画（原创、本地可维护）
  构成：宣纸底 → 自左进入并向右上舒展的青绿/灰青丝带 → 右下淡墨远山 → 轻微颗粒与留白。
  约束：不含人物、建筑、科技符号；viewBox 等比缩放，可作为普通 <img> 使用。
  调整说明：改变丝带层次只需增删 <g id="ribbons"> 内的 path；远山在 <g id="ink-ridge">。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img"
     aria-label="青绿山水抽象水墨插画：水波丝带自左侧舒展并向右上延伸，右下为淡墨远山">
  <defs>
    <!-- 宣纸底色：暖米白到象牙白的极轻过渡 -->
    <linearGradient id="paper" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#f7f3e7"/>
      <stop offset="55%" stop-color="#f4efe1"/>
      <stop offset="100%" stop-color="#efe9da"/>
    </linearGradient>
    <!-- 丝带：自左的青绿过渡到右上的灰青，保持低饱和 -->
    <linearGradient id="ribbonJade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7d9a8c" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#6f8f8a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#9aa9a8" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="ribbonMist" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#9aa8a4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#b9c2bd" stop-opacity="0.22"/>
    </linearGradient>
    <!-- 远山墨色：灰青，靠近水面处渐隐 -->
    <linearGradient id="inkWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c6b66" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#7c8781" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#8d968f" stop-opacity="0.05"/>
    </linearGradient>
    <!-- 纸面颗粒 -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faded">
        <feFuncA type="linear" slope="0.055"/>
      </feComponentTransfer>
    </filter>
    <!-- 墨迹柔和边缘 -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
  </defs>

  <rect width="900" height="560" fill="url(#paper)"/>

  <!-- 留白中的淡色水痕，让纸面不空 -->
  <ellipse cx="596" cy="300" rx="270" ry="130" fill="#e9e3d2" opacity="0.5"/>

  <!-- 水波丝带：自左进入，中部舒展，向右上延伸 -->
  <g id="ribbons" fill="none" stroke-linecap="round">
    <path d="M-40 372 C 150 300, 300 452, 470 366 C 620 290, 720 250, 946 148"
          stroke="url(#ribbonJade)" stroke-width="26" opacity="0.55"/>
    <path d="M-40 402 C 160 336, 306 470, 486 392 C 640 322, 736 282, 946 186"
          stroke="url(#ribbonMist)" stroke-width="15" opacity="0.75"/>
    <path d="M-40 344 C 140 274, 296 428, 456 344 C 610 264, 716 226, 946 118"
          stroke="#8ea79b" stroke-width="6" opacity="0.4"/>
    <path d="M-40 430 C 176 372, 320 496, 512 424 C 662 366, 752 330, 946 236"
          stroke="#a8b3ae" stroke-width="4" opacity="0.35"/>
    <path d="M-40 318 C 132 250, 292 404, 444 322 C 596 240, 706 202, 946 88"
          stroke="#b3bdb5" stroke-width="2.4" opacity="0.3"/>
  </g>

  <!-- 墨迹点与短线：少量、克制 -->
  <g id="ink-specks" fill="#6c7a74" opacity="0.28">
    <circle cx="352" cy="386" r="3.1"/>
    <circle cx="470" cy="352" r="2.3"/>
    <circle cx="238" cy="332" r="2"/>
    <circle cx="644" cy="286" r="2.6"/>
    <circle cx="742" cy="238" r="1.8"/>
  </g>

  <!-- 右下远山：淡墨层叠，近水处渐隐 -->
  <g id="ink-ridge">
    <path d="M470 470 C 540 424, 566 400, 616 372 C 664 346, 700 386, 742 404 C 792 426, 838 420, 902 452 L902 560 L470 560 Z"
          fill="url(#inkWash)" opacity="0.85"/>
    <path d="M604 438 C 646 404, 676 386, 712 392 C 758 400, 806 434, 902 480 L902 560 L604 560 Z"
          fill="#6f7c76" opacity="0.2" filter="url(#soft)"/>
    <path d="M604 438 C 646 404, 676 386, 712 392 C 758 400, 806 434, 902 480"
          fill="none" stroke="#5b6a64" stroke-width="1.6" opacity="0.42"/>
    <path d="M712 392 C 748 372, 772 366, 800 376 C 846 392, 872 404, 902 416"
          fill="none" stroke="#6c7a74" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- 水面横痕：暗示轻声水波，不画具体景物 -->
  <g id="waterlines" stroke="#8b978f" stroke-width="1" opacity="0.22" fill="none">
    <path d="M60 494 C 190 482, 320 508, 452 492"/>
    <path d="M120 520 C 250 510, 366 532, 486 518"/>
    <path d="M210 540 C 320 532, 420 548, 528 538"/>
  </g>

  <rect width="900" height="560" filter="url(#grain)"/>
</svg>
