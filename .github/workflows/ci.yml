name: Python quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arts_smart
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: arts_smart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arts_smart -d arts_smart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://arts_smart:ci-password@localhost:5432/arts_smart
      APP_SECRET: ci-only-secret-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy backend
      - run: pytest -q --cov --cov-report=term-missing
      - run: python scripts/selftest.py
